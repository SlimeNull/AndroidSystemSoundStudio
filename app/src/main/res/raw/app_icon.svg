<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc" data-android-resource="raw">
  <title id="title">系统声音工坊应用图标</title>
  <desc id="desc">青绿色拟物底板上的金属手机，右侧发出三道声音波纹</desc>
  <defs>
    <linearGradient id="background" x1="90" y1="28" x2="420" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28a99e"/>
      <stop offset="0.48" stop-color="#08766f"/>
      <stop offset="1" stop-color="#004b48"/>
    </linearGradient>
    <radialGradient id="backgroundGlow" cx="0" cy="0" r="1" gradientTransform="translate(166 118) rotate(45) scale(324)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#84eee4" stop-opacity=".32"/>
      <stop offset=".66" stop-color="#2cb0a5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="backgroundShade" cx="0" cy="0" r="1" gradientTransform="translate(256 230) scale(382)" gradientUnits="userSpaceOnUse">
      <stop offset=".55" stop-color="#003d3a" stop-opacity="0"/>
      <stop offset="1" stop-color="#002d2b" stop-opacity=".46"/>
    </radialGradient>
    <linearGradient id="phoneRim" x1="119" y1="71" x2="332" y2="438" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8faaa8"/>
      <stop offset=".16" stop-color="#3d4e4d"/>
      <stop offset=".5" stop-color="#111a1a"/>
      <stop offset=".84" stop-color="#344442"/>
      <stop offset="1" stop-color="#93aaa7"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="153" y1="79" x2="285" y2="426" gradientUnits="userSpaceOnUse">
      <stop stop-color="#465957"/>
      <stop offset=".14" stop-color="#172322"/>
      <stop offset=".84" stop-color="#0d1515"/>
      <stop offset="1" stop-color="#334340"/>
    </linearGradient>
    <linearGradient id="screen" x1="162" y1="117" x2="286" y2="361" gradientUnits="userSpaceOnUse">
      <stop stop-color="#174e50"/>
      <stop offset=".54" stop-color="#0b3438"/>
      <stop offset="1" stop-color="#061f23"/>
    </linearGradient>
    <linearGradient id="screenSheen" x1="147" y1="123" x2="288" y2="306" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c8fffa" stop-opacity=".28"/>
      <stop offset=".38" stop-color="#7ee5dc" stop-opacity=".08"/>
      <stop offset=".39" stop-color="#7ee5dc" stop-opacity="0"/>
      <stop offset="1" stop-color="#7ee5dc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveFace" x1="322" y1="145" x2="431" y2="355" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0fffc"/>
      <stop offset=".45" stop-color="#aef8ef"/>
      <stop offset="1" stop-color="#5bcfc5"/>
    </linearGradient>
    <linearGradient id="waveEdge" x1="331" y1="163" x2="423" y2="367" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54cfc5"/>
      <stop offset="1" stop-color="#168f87"/>
    </linearGradient>
    <filter id="phoneShadow" x="-40%" y="-25%" width="190%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="14" dy="18" stdDeviation="16" flood-color="#002c2a" flood-opacity=".56"/>
    </filter>
    <filter id="waveShadow" x="-80%" y="-35%" width="250%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="7" dy="10" stdDeviation="7" flood-color="#003e3b" flood-opacity=".5"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="150" y="111" width="140" height="253" rx="18"/>
    </clipPath>
  </defs>

  <g id="icon-background">
    <rect width="512" height="512" fill="url(#background)"/>
    <rect width="512" height="512" fill="url(#backgroundGlow)"/>
    <rect width="512" height="512" fill="url(#backgroundShade)"/>
  </g>

  <g id="icon-foreground" transform="translate(20 24) scale(.93)">
    <g transform="translate(-16)">
    <ellipse cx="263" cy="421" rx="162" ry="31" fill="#003a37" opacity=".3"/>

    <g filter="url(#phoneShadow)" transform="rotate(-3 220 256)">
      <rect x="108" y="64" width="224" height="376" rx="45" fill="url(#phoneRim)"/>
      <rect x="114" y="70" width="212" height="364" rx="40" fill="url(#phoneBody)" stroke="#9eb3b0" stroke-opacity=".38" stroke-width="2"/>
      <path d="M120 108c0-18 14-32 32-32h130c18 0 32 14 32 32v4c-39-17-143-25-194 8v-12Z" fill="#d8ece8" opacity=".12"/>

      <rect x="146" y="107" width="148" height="261" rx="22" fill="#050c0d" stroke="#526765" stroke-width="3"/>
      <rect x="150" y="111" width="140" height="253" rx="18" fill="url(#screen)"/>
      <g clip-path="url(#screenClip)">
        <path d="M150 111h140v253H150z" fill="url(#screenSheen)"/>
        <circle cx="166" cy="142" r="68" fill="#62d8cf" opacity=".08"/>
        <path d="M165 284h18v30h-18zM191 254h18v60h-18zM217 230h18v84h-18zM243 267h18v47h-18z" fill="#a9f5ed" opacity=".92"/>
        <rect x="165" y="326" width="96" height="5" rx="2.5" fill="#2d7775"/>
        <circle cx="222" cy="328.5" r="9" fill="#d5fffa"/>
        <circle cx="222" cy="328.5" r="4" fill="#53cfc5"/>
      </g>

      <rect x="183" y="87" width="70" height="8" rx="4" fill="#070d0d"/>
      <rect x="188" y="88" width="60" height="2.5" rx="1.25" fill="#839995" opacity=".4"/>
      <circle cx="267" cy="91" r="5" fill="#071111"/>
      <circle cx="266" cy="90" r="1.7" fill="#79c9c4" opacity=".65"/>

      <circle cx="220" cy="400" r="18" fill="#090f0f" stroke="#52625f" stroke-width="2"/>
      <circle cx="220" cy="400" r="11" fill="none" stroke="#a3b5b2" stroke-opacity=".46" stroke-width="1.5"/>

      <path d="M116 132v92" stroke="#d8e7e4" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>
      <path d="M325 147v58" stroke="#020606" stroke-opacity=".9" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g fill="none" stroke-linecap="round" filter="url(#waveShadow)">
      <path d="M335 203c25 28 25 79 0 107" stroke="url(#waveEdge)" stroke-width="24" opacity=".9" transform="translate(4 7)"/>
      <path d="M335 203c25 28 25 79 0 107" stroke="url(#waveFace)" stroke-width="17"/>
      <path d="M374 176c43 43 43 119 0 162" stroke="url(#waveEdge)" stroke-width="24" opacity=".9" transform="translate(4 7)"/>
      <path d="M374 176c43 43 43 119 0 162" stroke="url(#waveFace)" stroke-width="17"/>
      <path d="M414 145c61 61 61 165 0 226" stroke="url(#waveEdge)" stroke-width="24" opacity=".9" transform="translate(4 7)"/>
      <path d="M414 145c61 61 61 165 0 226" stroke="url(#waveFace)" stroke-width="17"/>
    </g>
    </g>
  </g>
</svg>
